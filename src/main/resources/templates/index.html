<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Micro-Farmer Crop Advisor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <h1 class="text-success fw-bold">🌱 Micro-Farmer Crop Disease Advisor</h1>
            <p class="text-muted">Upload a photo of an infected leaf to receive an instant AI diagnosis and organic treatment plan.</p>

            <!-- Upload Card -->
            <div class="card shadow-sm p-4 mt-4">
                <form action="/diagnose" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <input type="file" id="imageInput" name="image" class="form-control" accept=".jpg,.jpeg,.png,.bmp" required onchange="previewSelectedImage(event)">
                    </div>

                    <!-- Instant Client-Side Image Preview -->
                    <div id="previewContainer" class="mb-3 d-none">
                        <p class="text-muted small mb-1">Image Preview:</p>
                        <img id="imagePreview" src="#" alt="Leaf Preview" class="img-thumbnail" style="max-height: 220px;">
                    </div>

                    <button type="submit" class="btn btn-success w-100">Diagnose Crop Disease</button>
                </form>
            </div>

            <!-- Error Alert -->
            <div th:if="${error}" class="alert alert-danger mt-4" th:text="${error}"></div>

            <!-- Diagnosis Results Card -->
            <div th:if="${success}" class="card shadow-sm border-success mt-4 text-start">
                <div class="card-header bg-success text-white fw-bold d-flex justify-content-between align-items-center">
                    <span>Diagnosis Results</span>
                    <a href="/" class="btn btn-sm btn-outline-light">🌱 Scan Another Leaf</a>
                </div>
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-md-4 text-center mb-3 mb-md-0">
                            <img th:src="'data:image/jpeg;base64,' + ${imageData}" class="img-fluid rounded border shadow-sm" style="max-height: 180px;" alt="Diagnosed Leaf">
                        </div>
                        <div class="col-md-8">
                            <h5 class="card-title text-dark mb-1">
                                <strong>Detected Condition:</strong>
                            </h5>
                            <div class="d-flex align-items-center gap-2 mb-3">
                                <span th:text="${disease}" class="text-danger fw-bold fs-4"></span>
                                <span class="badge bg-primary fs-6" th:text="${confidence} + '% Confidence'"></span>
                            </div>
                            <hr>
                            <p class="card-text">
                                <strong>Organic Remedy:</strong><br>
                                <span th:text="${remedy}" class="text-secondary"></span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    function previewSelectedImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imagePreview').src = e.target.result;
                document.getElementById('previewContainer').classList.remove('d-none');
            }
            reader.readAsDataURL(file);
        }
    }
</script>

</body>
</html>
